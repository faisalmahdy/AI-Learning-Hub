name: Cloudflare Pages preview

# Deploys every PR push to Cloudflare Pages and comments the preview URL on
# the PR. Runs on GitHub's runners because the Claude Code container's egress
# policy blocks api.cloudflare.com. Requires two repository secrets
# (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   - token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  - from the Cloudflare dashboard overview page
# Until they exist, the deploy job skips cleanly instead of failing the PR.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: cf-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: ai-learning-hub

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        run: |
          ok="${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}"
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          if [ "$ok" != "true" ]; then
            echo "::notice::Cloudflare preview skipped - add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable it."
          fi

  preview:
    needs: gate
    if: needs.gate.outputs.ok == 'true' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate modules and data
        run: python tools/build_site.py --check
      - name: Build site
        run: python tools/build_site.py
      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main 2>/dev/null || true
          npx --yes wrangler@4 pages deploy site --project-name="$PROJECT" --branch="$BRANCH" --commit-dirty=true | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          if [ -z "$url" ]; then echo "::error::No deployment URL in wrangler output"; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment the preview URL on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- cf-pages-preview -->';
            const body = `${marker}\n**Cloudflare Pages preview**: ${process.env.URL}\n\nRedeployed on every push to this PR (commit ${context.payload.pull_request.head.sha.slice(0, 7)}).`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
